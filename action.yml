name: Device-driver v2 pregen check
description: Fail the build when the committed Rust file no longer matches its device-driver v2 DDSL source

inputs:
  source:
    description: Path to the DDSL source file, relative to your repository root
    required: true
  generated-file:
    description: Path to the committed Rust file to compare against, relative to your repository root
    default: src/device.rs
  cli-version:
    description: Lowest acceptable device-driver-cli v2 release; the newest compatible 2.x is installed
    default: '2.1.0'
  rust-toolchain:
    description: Exact stable Rust release to use, at least 1.94.0 and the selected CLI's MSRV
    default: '1.94.0'
  rust-defmt-feature:
    description: Cargo feature used to gate generated defmt implementations; leave empty to disable
    default: ''

runs:
  using: composite
  steps:
    - name: Validate versions
      id: validate
      shell: bash
      env:
        RUSTUP_TOOLCHAIN: ${{ inputs.rust-toolchain }}
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        set -euo pipefail
        if [[ ! "$CLI_VERSION" =~ ^2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo '::error::cli-version must be a stable v2 release, such as 2.1.0.'
          exit 1
        fi
        if (( BASH_REMATCH[1] < 1 )); then
          echo '::error::cli-version must be at least 2.1.0.'
          exit 1
        fi
        if [[ ! "$RUSTUP_TOOLCHAIN" =~ ^1\.([1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo '::error::rust-toolchain must be an exact stable release, such as 1.94.0.'
          exit 1
        fi
        if (( BASH_REMATCH[1] < 94 )); then
          echo '::error::rust-toolchain must be at least 1.94.0.'
          exit 1
        fi

    - name: Install Rust and rustfmt
      uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        components: rustfmt
      env:
        RUSTUP_TOOLCHAIN: ${{ inputs.rust-toolchain }}

    - name: Install compatible device-driver v2 compiler
      uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759
      with:
        crate: device-driver-cli
        version: '^${{ inputs.cli-version }}'
        locked: true
        cache-key: rust-${{ inputs.rust-toolchain }}
      env:
        RUSTUP_TOOLCHAIN: ${{ inputs.rust-toolchain }}

    - name: Generate, format, and compare
      id: check
      shell: bash
      env:
        RUSTUP_TOOLCHAIN: ${{ inputs.rust-toolchain }}
        SOURCE_FILE: ${{ inputs.source }}
        GENERATED_FILE: ${{ inputs.generated-file }}
        RUST_DEFMT_FEATURE: ${{ inputs.rust-defmt-feature }}
      run: |
        set -euo pipefail
        cd -- "$GITHUB_WORKSPACE"
        repo_root="$(pwd -P)"

        resolve_file() {
          local input_path="$1"
          local label="$2"
          local resolved_path
          # shellcheck disable=SC1003 # *'\'* is a literal-backslash glob, not an escaped quote.
          if [[ -z "$input_path" || "$input_path" == /* || "$input_path" =~ ^[A-Za-z]: || "$input_path" == *'\'* ]]; then
            printf '::error::%s must be a repository-relative path with forward slashes.\n' "$label" >&2
            return 1
          fi
          if ! resolved_path="$(realpath -e -- "$input_path")"; then
            printf '::error::%s does not exist.\n' "$label" >&2
            return 1
          fi
          if [[ "$resolved_path" != "$repo_root/"* || ! -f "$resolved_path" ]]; then
            printf '::error::%s must be a regular file inside the checkout.\n' "$label" >&2
            return 1
          fi
          printf './%s\n' "${resolved_path#"$repo_root/"}"
        }

        source_path="$(resolve_file "$SOURCE_FILE" source)"
        generated_path="$(resolve_file "$GENERATED_FILE" generated-file)"
        temp_file="$(mktemp --tmpdir="$repo_root" --suffix=.rs '.device-driver-pregen.XXXXXXXX')"
        trap 'rm -f -- "$temp_file"' EXIT

        rust_args=()
        if [[ -n "$RUST_DEFMT_FEATURE" ]]; then
          rust_args+=("--rust-defmt-feature=$RUST_DEFMT_FEATURE")
        fi

        ddc --version
        rustfmt --version
        ddc build --source "$source_path" --output "$temp_file" rust "${rust_args[@]}"
        rustfmt --edition 2024 --config newline_style=Unix "$temp_file"
        diff -u -- "$generated_path" "$temp_file"
        echo 'Generated Rust matches the committed file.'
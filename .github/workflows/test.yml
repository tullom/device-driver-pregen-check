name: Test pregen check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Check workflows
        run: '"$(go env GOPATH)/bin/actionlint"'

  behavior:
    name: Test shell behavior
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust and rustfmt
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: '1.95.0'
          components: rustfmt
      - name: Install device-driver v2 compiler
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759
        with:
          crate: device-driver-cli
          version: '=2.1.0'
          locked: true
          cache-key: rust-1.95.0
      - name: Run behavior tests
        run: cargo test --locked

  composite:
    name: Test composite action (${{ matrix.cli-version || 'latest compatible' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - cli-version: ''
            install-version: '^2.1.1'
          - cli-version: '2.1.0'
            install-version: '=2.1.0'
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust and rustfmt
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: '1.95.0'
          components: rustfmt
      - name: Install device-driver v2 compiler
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759
        with:
          crate: device-driver-cli
          version: ${{ matrix.install-version }}
          locked: true
          cache-key: rust-1.95.0
      - name: Generate smoke-test baseline
        id: prepare-fixture
        shell: bash
        run: |
          set -euo pipefail
          cd -- "$GITHUB_WORKSPACE"
          temp_file="$(mktemp --tmpdir="$GITHUB_WORKSPACE" --suffix=.rs '.device-driver-pregen.XXXXXXXX')"
          trap 'rm -f -- "$temp_file"' EXIT
          ddc build --source tests/fixtures/device.ddsl --output "$temp_file" rust
          rustfmt --edition 2024 --config newline_style=Unix "$temp_file"
          mv -- "$temp_file" tests/fixtures/device.rs
      - uses: ./
        with:
          source: tests/fixtures/device.ddsl
          generated-file: tests/fixtures/device.rs
          cli-version: ${{ matrix.cli-version }}